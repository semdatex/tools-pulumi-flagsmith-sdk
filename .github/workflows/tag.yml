name: Tag release

# Cuts an immutable release tag once main provably builds.
#
# It chains off CI rather than firing on push: a merge that breaks the build in
# ANY way — not just ways the failure marker captures — must not receive a tag,
# because tags are immutable and are what downstream repositories pin.
#
# No paths filter, and none is needed: next-tag.sh refuses to cut a second tag
# for identical SDK content, so a docs-only merge costs a short run that
# correctly declines. See docs/pipeline.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Cut a tag even if the SDK content is unchanged since the last tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    name: Compute and push the next tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CI also completes on pull requests and on red runs; tag only after a
    # SUCCESSFUL run on main. Manual dispatch skips that gate deliberately — it
    # is a human act against the current main tip.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag exactly the commit CI verified, not whatever main has become by
          # now; the content-hash dedup makes overlapping runs converge.
          # Full history + tags: computing <n> needs every existing v*-sdk.*.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          fetch-depth: 0

      # Last line of defence behind the CI-success gate: a determined human
      # could still mark a build-failing draft ready and merge it. Deleting the
      # marker is part of fixing the branch, so this cannot block a real release.
      - name: Refuse to tag a known-broken tree
        run: |
          set -euo pipefail
          if [[ -f BUILD-FAILURE.md ]]; then
            echo "::error::BUILD-FAILURE.md is present on this commit — refusing to cut a release tag."
            echo "Fix the build on a branch, delete BUILD-FAILURE.md, and merge that."
            sed -n '1,40p' BUILD-FAILURE.md
            exit 1
          fi
          echo "No build-failure marker — proceeding."

      - name: Compute the next tag
        id: next
        env:
          FORCE: ${{ inputs.force }}
        run: ./scripts/next-tag.sh

      - name: Push the tag
        if: steps.next.outputs.should_tag == 'true'
        env:
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "SDK release $TAG

          Flagsmith provider: $(node -p "require('./package.json').pulumi.parameterization.version")
          Bridge plugin:      $(node -p "require('./package.json').pulumi.version")
          Commit:             $(git rev-parse HEAD)"
          git push origin "$TAG"
          echo "Pushed $TAG"

      - name: Summary
        if: always()
        env:
          SHOULD_TAG: ${{ steps.next.outputs.should_tag }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          {
            echo "### Tag release"
            echo
            if [[ "$SHOULD_TAG" == "true" ]]; then
              echo "Cut \`${TAG}\`. Consumers pin it with:"
              echo
              echo '```bash'
              echo "npm install github:${GITHUB_REPOSITORY}#${TAG}"
              echo '```'
            else
              echo "No tag cut — SDK content unchanged since \`${TAG}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
