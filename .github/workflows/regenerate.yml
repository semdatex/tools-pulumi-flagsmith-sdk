name: Regenerate SDK

# Watches upstream and PROPOSES new SDK builds by pull request. Never writes to
# main, holds no secrets. See docs/pipeline.md for how and why this works.
#
# The logic lives in scripts/ so it is readable, shellcheck-able and runnable
# locally; this file only wires the steps together.

on:
  schedule:
    # Mondays 04:17 UTC, off-the-hour to dodge the scheduler's peak-minute queue.
    # GitHub disables cron in public repos after 60 days of inactivity and
    # upstream ships roughly yearly, so expect to re-enable this occasionally;
    # the manual dispatch below is the reliable path.
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      provider_version:
        description: "Provider version to build (blank = latest upstream release, or the declared pin when force is set)"
        required: false
        type: string
      bridge_version:
        description: "Bridge plugin version (blank = keep the pins.yml value)"
        required: false
        type: string
      pulumi_version:
        description: "Pulumi CLI version (blank = keep the pins.yml value)"
        required: false
        type: string
      force:
        description: "Propose even if versions already match pins.yml, and re-propose versions a previous PR rejected"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  # Cheap and read-only: works out what to build and whether to bother, so the
  # expensive write-capable job below is gated once instead of every step
  # repeating the condition.
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
      provider: ${{ steps.decide.outputs.provider }}
      bridge: ${{ steps.decide.outputs.bridge }}
      pulumi_cli: ${{ steps.decide.outputs.pulumi_cli }}
      old_provider: ${{ steps.decide.outputs.old_provider }}
      old_bridge: ${{ steps.decide.outputs.old_bridge }}
      branch: ${{ steps.decide.outputs.branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          IN_PROVIDER: ${{ inputs.provider_version }}
          IN_BRIDGE: ${{ inputs.bridge_version }}
          IN_PULUMI: ${{ inputs.pulumi_version }}
          FORCE: ${{ inputs.force }}
        run: ./scripts/decide-build.sh

  propose:
    name: Regenerate, gate, open PR
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the proposal branch
      pull-requests: write # open the proposal PR
      statuses: write # stamp the gate result on the PR head commit
    env:
      PROVIDER: ${{ needs.check.outputs.provider }}
      BRIDGE: ${{ needs.check.outputs.bridge }}
      OLD_PROVIDER: ${{ needs.check.outputs.old_provider }}
      OLD_BRIDGE: ${{ needs.check.outputs.old_bridge }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      # No `cache: npm`: regeneration replaces package.json wholesale, so a
      # lockfile-keyed cache cannot help and its absence must not fail the job.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pulumi CLI
        id: pulumi
        env:
          PULUMI_VERSION: ${{ needs.check.outputs.pulumi_cli }}
        run: ./scripts/install-pulumi.sh

      # The next three steps must NOT abort the job — a failed gate still
      # produces a PR, marked as broken. Each records its outcome; evaluate-gate
      # decides. All three pins including the CLI are written, so a dispatch
      # override cannot leave pins.yml disagreeing with what was built.
      - name: Write the target pins
        id: writepins
        continue-on-error: true
        env:
          PULUMI_CLI_PIN: ${{ needs.check.outputs.pulumi_cli }}
        run: ./scripts/write-pins.sh

      - name: Regenerate
        id: regen
        if: steps.writepins.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/regenerate.sh "$PROVIDER" "$BRIDGE" 2>&1 | tee -a gate-output.txt

      # The same gate ci.yml runs, minus --check-bin (a changed bin/ is the point
      # here) and with a plain install (codegen just rewrote package.json, so the
      # committed lockfile is legitimately stale).
      - name: Gate
        id: gate
        if: steps.regen.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          ./scripts/gate.sh --install install 2>&1 | tee -a gate-output.txt

      - name: Evaluate gate
        id: verdict
        env:
          O_WRITEPINS: ${{ steps.writepins.outcome }}
          O_REGEN: ${{ steps.regen.outcome }}
          O_GATE: ${{ steps.gate.outcome }}
          PULUMI_CLI: ${{ steps.pulumi.outputs.version }}
        run: ./scripts/evaluate-gate.sh

      - name: Open proposal PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.check.outputs.branch }}
          PULUMI_CLI: ${{ steps.pulumi.outputs.version }}
          PASSED: ${{ steps.verdict.outputs.passed }}
          FAILED_STAGE: ${{ steps.verdict.outputs.failed_stage }}
        run: ./scripts/open-proposal.sh

      # Makes the inline gate visible in the PR's merge box. GITHUB_TOKEN may not
      # trigger workflows, but it may report a commit status.
      - name: Stamp gate result on the commit
        if: steps.pr.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.sha }}
          PASSED: ${{ steps.verdict.outputs.passed }}
          FAILED_STAGE: ${{ steps.verdict.outputs.failed_stage }}
        run: ./scripts/stamp-status.sh

      - name: Summary
        if: always()
        env:
          OPENED: ${{ steps.pr.outputs.opened }}
          PASSED: ${{ steps.verdict.outputs.passed }}
          FAILED_STAGE: ${{ steps.verdict.outputs.failed_stage }}
        run: |
          {
            echo "### Regenerate SDK"
            echo
            if [[ "$OPENED" != "true" ]]; then
              echo "Regeneration produced no changes; no PR opened."
            elif [[ "$PASSED" == "true" ]]; then
              echo "Proposal PR opened and **passing** — ready for review."
            else
              echo "Proposal PR opened as a **draft**, marked \`build-failing\`."
              echo "Failed at: \`${FAILED_STAGE}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
