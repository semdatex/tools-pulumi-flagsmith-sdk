# Declared build pins — the DESIRED state of this SDK.
#
# This file is the input to regeneration. `package.json` is the output: it is
# written by codegen and carries the same versions inside its `pulumi`
# parameterization block. `scripts/repackage.sh` asserts the two agree, so they
# cannot drift — but the direction of authority matters, so be precise about it:
#
#     pins.yml       what we have decided to build   (edited by a human, reviewed)
#     package.json   what was actually built         (written by codegen)
#
# Never hand-edit the versions in package.json. Change them here.
#
# ---------------------------------------------------------------------------
# HOW A NEW VERSION GETS BUILT
#
# Normally you do not edit this file by hand. A weekly watcher compares the
# provider pin below against the latest upstream release and, when it is behind,
# opens a pull request containing BOTH the updated pins and the freshly built
# SDK — so the declaration and the artifact arrive in one reviewable commit.
# A human merges it, and `tag.yml` cuts the immutable tag `v<provider>-sdk.<n>`.
#
#   watcher ─▶ regenerate + gate ─▶ proposal PR ─▶ review + merge ─▶ tag
#
# To bump on demand, run Actions -> "Regenerate SDK" -> Run workflow (blank
# inputs target the latest upstream release). Editing this file by hand is
# still fine, but then you must rebuild too, or `ci.yml` fails the PR for
# declaring a version that was never built:
#
#   scripts/regenerate.sh <provider> <bridge> && npm install && npm run build
#
# The tag is the release. Downstream repositories pin it:
#
#   npm install github:semdatex/tools-pulumi-flagsmith-sdk#v0.10.0-sdk.1
#
# Older tags stay consumable forever, so different consumers can sit on
# different provider versions without this repository having to hold more than
# one at a time.
# ---------------------------------------------------------------------------

# The Flagsmith Terraform provider, resolved from registry.opentofu.org.
# Upstream releases: https://github.com/flagsmith/terraform-provider-flagsmith/releases
# This value also becomes the `version` field of the generated package.
provider: "0.10.0"

# Pulumi's dynamic Terraform bridge plugin, which does the bridging and whose
# codegen produces the SDK.
bridge: "1.3.0"

# Pulumi CLI used to run codegen. Codegen output depends on it, so it is a third
# reproducibility dimension and is pinned here rather than tracking whatever
# Pulumi ships that week.
#
# v3.256.0 is the version that reproduced the known-good baseline byte-for-byte
# on the first CI regeneration. Leave empty to use the latest stable release
# instead — but then a codegen change upstream can alter the output without any
# pin in this file moving.
pulumi_cli: "v3.256.0"
